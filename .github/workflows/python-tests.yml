name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python data/generate_data.py

      - name: Train fraud detection model
        run: python ml/train_model.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t fraudshield-ai .

      - name: Start Docker container
        run: |
          docker run -d \
            --name fraudshield-api \
            -p 8000:8000 \
            fraudshield-ai

      - name: Wait for API
        run: sleep 5

      - name: Test Docker health endpoint
        run: |
          curl --fail http://localhost:8000/health

      - name: Stop Docker container
        if: always()
        run: |
          docker stop fraudshield-api || true
          docker rm fraudshield-api || true
